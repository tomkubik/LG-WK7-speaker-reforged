// AirPlay 2 config: shairport-sync-ap2 -> pipe (48 kHz S16 stereo) -> aplay -> LG audio route
general = {
  name = "WK7";
  output_backend = "pipe";
  volume_range_db = 50;
  dbus_service_bus = "system";
  mpris_service_bus = "system";
};
pipe = {
  name = "/tmp/shairport-sync-audio";
  output_rate = 48000;
  output_format = "S16_LE";
  output_channels = 2;
};
metadata = {
  enabled = "yes";
  include_cover_art = "no";
  pipe_name = "/tmp/shairport-sync-metadata";
};
sessioncontrol = {
  run_this_before_entering_active_state = "/usr/local/bin/wk7-airplay-hook start";
  run_this_after_exiting_active_state = "/usr/local/bin/wk7-airplay-hook stop";
};
