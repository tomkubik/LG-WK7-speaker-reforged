# Resample everything to 48 kHz S16 stereo before LG's ADSP (it misbehaves on 44.1 kHz)
pcm.wk7 {
  type plug
  slave { pcm "hw:0,0" rate 48000 format S16_LE channels 2 }
  rate_converter "speexrate_medium"
}
# Spotify Connect (spotifyd, 44.1 kHz) -> DSP input MultiMedia5 (hw:0,12), mixed in hardware like moOde's MultiMedia2
pcm.wk7spotify {
  type plug
  slave { pcm "hw:0,12" rate 48000 format S16_LE channels 2 }
  rate_converter "speexrate_medium"
}
